apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-rule
  namespace: monitoring
  labels:
    role: ruler
    release: prometheus
spec:
  groups:
    - name: pod restart
      rules:
        - alert: pod restart
          annotations:
            summary: >-
              kubernetes pod {{ $labels.pod}}) in {{ $labels.namespace }} has
              been restarted
          expr: >-
            sum by (namespace, pod)
            (min_over_time(kube_pod_container_status_restarts_total[3m])) > 0
          labels:
            severity: critical
    - name: pod evicted
      rules:
        - alert: pod evicted
          annotations:
            summary: >-
              kubernetes pod {{ $labels.pod}}) in {{ $labels.namespace }} has
              been evicted
          expr: >-
            sum by (namespace, pod) (kube_pod_status_phase{phase =~ "Failed"} >
            0 and on(namespace, pod) kube_pod_status_reason{reason =~ "Evicted"} > 0) > 0
          labels:
            severity: critical
    - name: pod oom
      rules:
        - alert: pod oom
          annotations:
            summary: >-
              An OOM happened in kubernetes pod {{ $labels.pod}}  in {{
              $labels.namespace }}
          expr: |-
            sum by (namespace, pod) (
              changes(kube_pod_container_status_restarts_total[3m]) > 0
            ) * on(namespace, pod) group_left() (
              kube_pod_container_status_last_terminated_reason{reason =~ "OOMKilled"}
            )
          labels:
            severity: critical
    - name: pod error
      rules:
        - alert: pod error
          annotations:
            summary: >-
              An Error happened in kubernetes pod {{ $labels.pod}}  in {{
              $labels.namespace }}
          expr: |-
            sum by (namespace, pod, container) (
              changes(kube_pod_container_status_restarts_total[3m]) > 0
            ) * on(namespace, pod, container) group_left() (
              kube_pod_container_status_last_terminated_reason{reason =~ "Error"}
            )
          labels:
            severity: critical
    - name: pod not ready or probe failure
      rules:
        - alert: pod not ready or probe failure
          annotations:
            summary: >-
              kubernetes pod {{ $labels.pod}}) in {{ $labels.namespace }} has
              been not ready or probe failure
          expr: >-
            sum by (namespace, pod)
            (min_over_time(kube_pod_status_ready{condition =~ "false"}[3m])) == 1
          labels:
            severity: critical
    - name: pod crashloopbakoff
      rules:
        - alert: pod crashloopbakoff
          annotations:
            summary: >-
              An CrashLoopBackOff happened in kubernetes pod {{ $labels.pod}} 
              in {{ $labels.namespace }}
          expr: >-
            sum by (namespace, pod)
            (min_over_time(kube_pod_container_status_waiting_reason{reason =~
            "CrashLoopBackOff"}[3m])) > 0
          labels:
            severity: critical